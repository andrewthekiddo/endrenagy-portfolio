<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MVM Dome térkép</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* MVM Dome arculat: navy + sárga + világoskék, Nunito */
    --bg:#1D2939; --navy:#101828; --panel:rgba(16,24,40,.88); --panel-border:rgba(252,252,253,.08);
    --text:#FCFCFD; --muted:#98A2B3; --yellow:#FCBF20; --blue:#3BC3EE; --accent:var(--yellow);
    --pin:var(--blue); --pin-active:var(--yellow);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* --- brand bar --- */
  .brand{position:fixed;top:18px;left:18px;display:flex;align-items:center;gap:12px;z-index:10;pointer-events:none}
  .brand img{height:30px;width:auto;display:block}
  .brand .sep{width:1px;height:26px;background:var(--panel-border)}
  .brand h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text)}
  .brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:1px;text-transform:none;letter-spacing:0}

  /* --- level switcher --- */
  .levels{position:fixed;right:18px;bottom:24px;z-index:10;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:999px;background:var(--panel);border:1px solid var(--panel-border);backdrop-filter:blur(14px)}
  .levels button{width:64px;height:64px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:800 21px Nunito,sans-serif;cursor:pointer;transition:.18s;position:relative}
  .levels button:hover{color:var(--text)}
  .levels button.active{background:var(--yellow);color:var(--navy)}
  .levels button .tip{position:absolute;right:78px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--navy);border:1px solid var(--panel-border);color:var(--text);font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:.15s}
  .levels button:hover .tip{opacity:1}

  /* --- filter panel --- */
  .filters{position:fixed;left:18px;bottom:24px;z-index:10;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:12px;border-radius:18px;background:var(--panel);border:1px solid var(--panel-border);backdrop-filter:blur(14px);width:min(420px,calc(100vw - 36px))}
  .filters .title{grid-column:1/-1;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:2px 6px 6px}
  .filters .col{display:flex;flex-direction:column;gap:2px}
  .filters .col+.col{border-left:1px solid var(--panel-border);padding-left:10px}
  .chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:0;background:transparent;color:var(--text);font:600 13px Nunito,sans-serif;cursor:pointer;text-align:left;transition:.15s;width:100%}
  .chip:hover{background:rgba(252,252,253,.05)}
  .chip .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:rgba(252,252,253,.07);color:var(--text);font-size:12px;font-weight:800;transition:.15s}
  .chip .dot svg{width:16px;height:16px;fill:none;stroke:var(--text);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .chip.active .dot svg{stroke:var(--navy)}
  .chip .n{margin-left:auto;color:var(--muted);font-size:12px}
  .chip.active{background:rgba(252,191,32,.14);color:var(--yellow)}
  .chip.active .dot{background:var(--yellow);color:var(--navy)}
  .chip.dim{opacity:.45}
  .chip.off{opacity:.45}
  .chip.all{grid-column:1/-1;justify-content:center;margin-top:6px;padding:10px;border-radius:10px;background:rgba(252,252,253,.04);font-weight:800}

  /* --- sector search --- */
  .search{position:fixed;top:18px;right:18px;z-index:10;display:flex;gap:6px;padding:6px;border-radius:12px;background:var(--panel);border:1px solid var(--panel-border);backdrop-filter:blur(14px)}
  .search input{width:150px;background:transparent;border:0;color:var(--text);font:600 13px Nunito,sans-serif;padding:8px 10px;outline:0}
  .search input::placeholder{color:var(--muted)}
  .search button{border:0;border-radius:8px;background:var(--yellow);color:var(--navy);font:700 13px Nunito,sans-serif;padding:0 14px;cursor:pointer}

  /* --- markers --- */
  #markers{position:fixed;inset:0;pointer-events:none;z-index:5}
  .mk{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:opacity .2s;will-change:transform}
  .mk .pin{width:32px;height:32px;border-radius:50%;background:var(--pin);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(16,24,40,.6),0 6px 18px rgba(0,0,0,.45),0 0 18px var(--pin);transition:transform .15s,background .2s}
  .mk .pin svg{width:19px;height:19px;fill:none;stroke:var(--navy);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .mk .stem{width:2px;height:12px;background:var(--pin);opacity:.8}
  .mk.focus{--pin:var(--pin-active) !important}
  .mk.focus .pin{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 3px rgba(16,24,40,.6),0 6px 18px rgba(0,0,0,.45),0 0 12px var(--pin)}50%{transform:scale(1.05);box-shadow:0 0 0 6px rgba(252,191,32,.14),0 6px 18px rgba(0,0,0,.45),0 0 22px var(--pin)}}
  .mk:hover .pin,.mk.sel .pin{transform:scale(1.18)}
  .mk .lbl{position:absolute;bottom:calc(100% + 6px);white-space:nowrap;background:var(--navy);border:1px solid var(--panel-border);padding:5px 9px;border-radius:7px;font-size:12px;font-weight:500;opacity:0;transition:.15s;pointer-events:none}
  .mk:hover .lbl{opacity:1}
  .mk.hidden{opacity:0;pointer-events:none}
  .mk.szektor .pin{width:auto;height:22px;border-radius:6px;padding:0 7px;font-size:11px;font-weight:800;color:var(--yellow);background:var(--navy);border:1px solid rgba(252,191,32,.5);box-shadow:0 2px 8px rgba(0,0,0,.4);animation:none}
  .mk.szektor.sel .pin{background:var(--yellow);color:var(--navy)}
  .mk.szektor .stem{display:none}

  /* --- jobb oldali infópanel (Ziggo-stílus) --- */
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:12;background:var(--navy);border-left:1px solid var(--panel-border);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
  .panel.show{transform:translateX(0)}
  .panel .photo{aspect-ratio:16/10;background:#1D2939 center/cover no-repeat;flex:none;position:relative}
  .panel .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,24,40,0) 55%,var(--navy) 100%)}
  .panel .x{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(16,24,40,.75);color:var(--text);font-size:20px;cursor:pointer;line-height:1;backdrop-filter:blur(8px)}
  .panel .body{padding:22px 26px 26px;overflow:auto}
  .panel .cat{font-size:13px;font-weight:800;color:var(--yellow);letter-spacing:.02em}
  .panel h2{margin:6px 0 12px;font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .panel p{margin:0 0 8px;color:#D0D5DD;font-size:15px;line-height:1.55}
  .panel .near{margin:14px 0 0;font-size:13px;color:var(--muted)}
  .panel .near b{color:var(--text);font-weight:700}
  .panel .more{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:11px 20px;border-radius:999px;border:2px solid var(--yellow);color:var(--text);font:700 15px Nunito,sans-serif;background:transparent;cursor:pointer;text-decoration:none}
  .panel .more:hover{background:rgba(252,191,32,.12)}
  .panel .back{margin-top:12px;display:block;background:transparent;border:0;color:var(--muted);font:600 13px Nunito,sans-serif;cursor:pointer;padding:0}
  .panel .back:hover{color:var(--text)}
  body.panel-open .search,body.panel-open .levels{transform:translateX(calc(-1 * min(400px,100vw)))}
  .search,.levels{transition:transform .35s cubic-bezier(.2,.8,.2,1)}

  /* --- vissza az áttekintéshez (részletnézetben) --- */
  .overview{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:10;display:none;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--panel-border);color:var(--text);font:700 13px Nunito,sans-serif;cursor:pointer;backdrop-filter:blur(14px)}
  .overview.show{display:inline-flex}
  .overview:hover{border-color:var(--yellow)}

  /* --- loader --- */
  .loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
  .loader.hide{opacity:0;pointer-events:none}
  .loader .pct{font-size:56px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .loader .lvl{color:var(--muted);font-size:14px;font-weight:500}
  .loader .bar{width:220px;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
  .loader .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .loader .logo{width:min(220px,60vw);height:auto;display:block;margin-bottom:10px;animation:breathe 2.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:60;background:var(--navy);border:1px solid var(--panel-border);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .hint{position:fixed;left:50%;top:72px;transform:translateX(-50%);color:var(--muted);font-size:12px;z-index:9;pointer-events:none;transition:.4s}
  .hint.hide{opacity:0}

  @media (max-width:640px){
    .filters{width:auto;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:nowrap;overflow-x:auto;padding:6px;border-radius:12px;gap:2px}
    .filters .title{display:none}
    .filters .col{flex-direction:row}.filters .col+.col{border:0;padding:0}
    .chip{width:auto;padding:6px 8px;white-space:nowrap}.chip .n{display:none}.chip.all{margin:0;padding:6px 10px;background:transparent}
    .levels{bottom:78px;right:12px;flex-direction:row}
    .levels button{width:50px;height:50px;font-size:17px}
    .levels button .tip{display:none}
    .panel{top:auto;left:0;right:0;width:100%;height:62vh;border-left:0;border-top:1px solid var(--panel-border);border-radius:18px 18px 0 0;transform:translateY(100%)}
    .panel.show{transform:translateY(0)}
    .panel .photo{aspect-ratio:16/7}
    .panel h2{font-size:22px}
    body.panel-open .search,body.panel-open .levels{transform:none}
    .overview{top:auto;bottom:140px}
    .brand img{height:24px}.brand h1{font-size:12px}
    .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="markers"></div>

<div class="brand">
  <img src="/projekt/mvm-dome/logo.svg" alt="MVM Dome">
  <div class="sep"></div>
  <div><h1>Interaktív térkép</h1><small>Felső körüljáró szint · prototípus</small></div>
</div>

<div class="hint" id="hint">Húzd jobbra-balra a körbejáráshoz · dupla kattintás: odarepül és szabadon forgatható</div>


<div class="filters" id="filters">
  <div class="title">Mutasd csak</div>
</div>

<div class="levels" id="levels">
  <button data-level="paholy"><span class="tip">Páholy szint · következő fázis</span>P</button>
  <button data-level="felso" class="active"><span class="tip">Felső körüljáró</span>F</button>
  <button data-level="also"><span class="tip">Alsó körüljáró · következő fázis</span>A</button>
</div>

<aside class="panel" id="panel">
  <div class="photo" id="panelPhoto"><button class="x" id="panelX" aria-label="Bezárás">×</button></div>
  <div class="body">
    <div class="cat" id="panelCat"></div>
    <h2 id="panelTitle"></h2>
    <p id="panelText"></p>
    <div class="near" id="panelNear"></div>
    <a class="more" id="panelMore" href="https://mvm-dome.hu/hu/szolgaltatasok" target="_blank" rel="noopener">Bővebben <span>›</span></a>
    <button class="back" id="panelBack">‹ Vissza az áttekintéshez</button>
  </div>
</aside>
<button class="overview" id="overviewBtn">‹ Vissza az áttekintéshez</button>

<div class="loader" id="loader">
  <img class="logo" src="/projekt/mvm-dome/loader-logo.png" alt="MVM Dome">
  <div class="pct" id="pct">0%</div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="lvl" id="lvlName">Felső körüljáró szint betöltése</div>
</div>
<div class="toast" id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="/projekt/mvm-dome/app.js"></script>
</body>
</html>
