<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MVM Dome térkép</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js">
<script>
// Gyors indulás (V2): a kezdőszint modellje és fénytérképe már a HTML beolvasásakor elkezd letöltődni, nem csak a kód elindulása után
(function () {
  var S = { lobby: 'S0', also: 'S1', paholy: 'S2', felso: 'S3', epulet: 'S4' }, q = new URLSearchParams(location.search), k = S[q.get('szint')] || 'S4';
  // az oldal címe lehet /projekt/mvm-dome (perjel nélkül, a portfólióban) → a fájlok mappáját a címből számoljuk, nem relatívan
  var p = location.pathname, B = /\/$/.test(p) ? p : /\.html?$/.test(p) ? p.replace(/[^/]*$/, '') : p + '/';
  function elo(href, as) { var l = document.createElement('link'); l.rel = 'preload'; l.as = as; l.href = B + href; if (as === 'fetch') l.crossOrigin = 'anonymous'; document.head.appendChild(l); }
  elo('models/' + k + '.glb', 'fetch'); if (!q.has('nolm')) elo('models/' + k + (q.has('lm8k') ? '_lm8k' : '_lm') + '.webp', 'image'); elo('data/' + k + '.json', 'fetch');
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* MVM Dome arculat a mvm-dome.hu szerint (2026-11-19): háttér #1D2939, kártya #101828, szöveg #FCFCFD, sárga #FCBF20, kék #007AC3; Nunito 400 / 900; gombok 8 px sarok, 44 px magas; kártyák 20 px sarok */
    --bg:#1D2939; --navy:#101828; --panel:rgba(16,24,40,.88); --panel-border:rgba(252,252,253,.08);
    --text:#FCFCFD; --muted:#98A2B3; --yellow:#FCBF20; --blue:#007AC3; --accent:var(--yellow);
    --pin:var(--yellow); --pin-active:#F79009;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* --- brand bar --- */
  .brand{position:fixed;top:0;left:0;right:0;height:72px;padding:0 24px;display:flex;align-items:center;gap:16px;z-index:9;pointer-events:none;background:linear-gradient(180deg,rgba(16,24,40,.92) 0%,rgba(16,24,40,.55) 60%,rgba(16,24,40,0) 100%)}
  .brand img{height:26px;width:auto;display:block}
  .brand .sep{width:1px;height:28px;background:rgba(252,252,253,.16)}
  .brand h1{margin:0;font-size:16px;font-weight:900;letter-spacing:0;color:var(--text)}
  .brand small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:1px}

  /* --- Újratervezés (2026-11-22, jegyoldal-stílus, csak a tesztoldalon): szintváltó fent, teljes nevekkel; bal oldali panel szektorlistával,
     szolgáltatásokkal és keresővel; kis vezérlőgombok jobb alul; a szektor rámutatásra kiemelődik --- */
  .levels{pointer-events:auto;margin-left:14px;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid rgba(252,252,253,.14);backdrop-filter:blur(14px);transition:opacity .2s}
  .levels button{height:36px;padding:0 15px;border-radius:999px;border:0;background:transparent;color:#D0D5DD;font:700 14px Nunito,sans-serif;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
  .levels button:hover{color:var(--text);background:rgba(252,252,253,.07)}
  .levels button.active{background:var(--yellow);color:var(--navy)}
  @media (min-width:641px) and (max-width:1250px){.brand .sep,.brand>div{display:none}.levels button{padding:0 11px;font-size:13px}}
  @media (min-width:641px) and (max-width:1500px){body.panel-open .levels{opacity:0;pointer-events:none}}

  /* --- bal oldali panel: kereső + Szektorok / Szolgáltatások fül --- */
  .side{position:fixed;left:16px;top:84px;bottom:16px;width:300px;z-index:11;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--panel-border);backdrop-filter:blur(14px);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
  body.side-closed .side{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
  body.no-side .side,body.no-side .sideOpen{display:none!important}
  .sideHead{display:flex;gap:8px;align-items:center}
  .srch{flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;background:rgba(252,252,253,.06);border:1px solid rgba(252,252,253,.08)}
  .srch:focus-within{border-color:var(--yellow)}
  .srch svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex:none}
  .srch input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:600 14px Nunito,sans-serif}
  .srch input::placeholder{color:var(--muted)}
  .sideX{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid rgba(252,252,253,.1);background:transparent;color:var(--muted);font:700 20px Nunito,sans-serif;cursor:pointer}
  .sideX:hover{color:var(--text);border-color:var(--yellow)}
  .tabs{display:flex;padding:4px;border-radius:12px;background:rgba(252,252,253,.05);flex:none}
  .tabs button{flex:1;height:34px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:800 13.5px Nunito,sans-serif;cursor:pointer}
  .tabs button.on{background:#26344b;color:var(--text)}
  .pane{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(252,252,253,.25) transparent;margin:0 -6px;padding:0 6px}
  .pane[hidden]{display:none}
  .grp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:10px 4px 6px}
  .srow{display:flex;align-items:center;gap:12px;width:100%;padding:7px 8px;border:0;border-radius:11px;background:transparent;color:var(--text);font:700 14px Nunito,sans-serif;text-align:left;cursor:pointer;transition:background .12s}
  .srow:hover,.srow.hov{background:rgba(252,191,32,.1)}
  .srow.on{background:rgba(252,191,32,.14);box-shadow:inset 0 0 0 1px rgba(252,191,32,.55)}
  .srow .n{min-width:48px;height:28px;padding:0 6px;border-radius:8px;display:grid;place-items:center;background:#1f2b3e;border:1px solid rgba(252,191,32,.4);color:var(--yellow);font-weight:900;font-size:13px;flex:none}
  .srow.on .n,.srow.hov .n{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
  .srow .ik2{width:28px;height:28px;flex:none;display:grid;place-items:center}
  .srow .ik2 .ik{width:28px;height:28px;display:block;border-radius:50%}
  .srow .ik2 .ik.sem{display:none}
  .srow .t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  .srow .t small{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ures{color:var(--muted);font-size:13px;padding:12px 6px}
  .sideOpen{position:fixed;left:16px;top:84px;z-index:11;display:none;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;background:var(--panel);border:1px solid var(--panel-border);color:var(--text);font:800 13.5px Nunito,sans-serif;cursor:pointer;backdrop-filter:blur(14px)}
  .sideOpen:hover{border-color:var(--yellow)}
  body.side-closed .sideOpen{display:inline-flex}
  .hovtip{position:fixed;left:0;top:0;z-index:20;pointer-events:none;background:#fff;color:var(--navy);border-radius:10px;padding:8px 12px;font:800 14px Nunito,sans-serif;box-shadow:0 10px 28px rgba(0,0,0,.45);white-space:nowrap;opacity:0;transition:opacity .12s}
  .hovtip small{display:block;color:#475467;font-weight:600;font-size:12px;margin-top:1px}
  .hovtip.show{opacity:1}
  .mk.szektor.hov .pin{background:var(--yellow);color:var(--navy);transform:scale(1.15)}

  /* --- filter panel (most a „Szolgáltatások” fül tartalma) --- */
  .filters{display:flex;flex-direction:column;gap:2px;padding-top:4px}
  .filters .title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:6px 4px 6px;flex:none}
  .filters .col{display:contents}
  .chip{flex:none}
  .chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:0;background:transparent;color:var(--text);font:600 13px Nunito,sans-serif;cursor:pointer;text-align:left;transition:.15s;width:100%}
  .chip:hover{background:rgba(252,252,253,.05)}
  .chip .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:rgba(252,252,253,.07);color:var(--text);font-size:12px;font-weight:800;transition:.15s}
  .chip .dot svg{width:16px;height:16px;fill:none;stroke:var(--text);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .chip .dot svg{stroke:var(--col,var(--text))}
  .chip.active .dot svg{stroke:var(--ink,var(--navy))}
  .chip .n{margin-left:auto;color:var(--muted);font-size:12px}
  .chip.active{background:rgba(252,252,253,.07);color:var(--col,var(--yellow))}
  .chip.active .dot{background:var(--col,var(--yellow));color:var(--navy)}
  .chip.none{display:none}
  .chip.dim{opacity:.45}
  .chip.off{opacity:.45}
  .chip.all{grid-column:1/-1;justify-content:center;margin-top:6px;padding:10px;border-radius:10px;background:rgba(252,252,253,.04);font-weight:800}

  /* --- sector search --- */
  .search{position:fixed;top:18px;right:18px;z-index:10;display:flex;gap:6px;padding:6px;border-radius:12px;background:var(--panel);border:1px solid var(--panel-border);backdrop-filter:blur(14px)}
  .search input{width:150px;background:transparent;border:0;color:var(--text);font:600 13px Nunito,sans-serif;padding:8px 10px;outline:0}
  .search input::placeholder{color:var(--muted)}
  .search button{border:0;border-radius:8px;background:var(--yellow);color:var(--navy);font:700 13px Nunito,sans-serif;padding:0 14px;cursor:pointer}

  /* --- vezérlőgombok: kis ikongombok egy oszlopban, jobb alul (újratervezés 2026-11-22); a felirat a buboréksúgóban --- */
  .tools{position:fixed;right:20px;bottom:24px;z-index:10;display:flex;flex-direction:column;gap:8px;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .tools .gap{height:6px}
  .tools button{position:relative;width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid rgba(252,252,253,.14);border-radius:12px;background:var(--panel);backdrop-filter:blur(10px);color:var(--text);cursor:pointer;transition:border-color .15s,background .15s}
  .tools button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tools button .t{position:absolute;right:54px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--navy);border:1px solid var(--panel-border);color:var(--text);font:600 12.5px Nunito,sans-serif;padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s}
  .tools button:hover .t{opacity:1}
  .tools button:hover{border-color:var(--yellow)}
  .tools button.kapcs{color:var(--muted)}
  .tools button.kapcs.on{color:var(--yellow);border-color:rgba(252,191,32,.55)}
  body.panel-open .tools{transform:translateX(calc(-1 * min(400px,100vw)))}

  /* --- markers --- */
  #markers{position:fixed;inset:0;pointer-events:none;z-index:5}
  .mk{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:opacity .2s;will-change:transform}
  .mk .pin{width:32px;height:32px;border-radius:50%;background:var(--pin);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(16,24,40,.6),0 6px 18px rgba(0,0,0,.45),0 0 18px var(--pin);transition:transform .15s,background .2s}
  .mk .pin svg{width:19px;height:19px;fill:none;stroke:var(--ink,var(--navy));stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .mk:not(.szektor) .pin{width:36px;height:36px;background:transparent;box-shadow:0 0 0 2.5px rgba(16,24,40,.75),0 6px 18px rgba(0,0,0,.45),0 0 16px var(--pin)}
  .mk .pin .ik{width:36px;height:36px;display:block;border-radius:50%}
  .chip .dot .ik{width:26px;height:26px;display:block;border-radius:50%}
  .chip .dot:has(.ik){background:transparent}
  .mk .stem{width:2px;height:12px;background:var(--pin);opacity:.8}
    .mk.focus .pin{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 3px rgba(16,24,40,.6),0 6px 18px rgba(0,0,0,.45),0 0 12px var(--pin)}50%{transform:scale(1.05);box-shadow:0 0 0 6px rgba(252,252,253,.12),0 6px 18px rgba(0,0,0,.45),0 0 22px var(--pin)}}
  .mk:hover .pin,.mk.sel .pin{transform:scale(1.18)}
  .mk .lbl{position:absolute;bottom:calc(100% + 6px);white-space:nowrap;background:var(--navy);border:1px solid var(--panel-border);padding:5px 9px;border-radius:7px;font-size:12px;font-weight:500;opacity:0;transition:.15s;pointer-events:none}
  .mk:hover .lbl{opacity:1}
  /* semleges alapállapot (sötét korong, sárga rajz); a kategória színe csak kijelöléskor (.focus / .sel) – az info és a lift mindig színes (.eredeti) */
  .mk{--pin:rgba(252,191,32,.45)}
  .mk.focus,.mk.sel,.mk.eredeti{--pin:var(--szin)}
  .mk .pin .ik.szin{display:none}
  .mk.focus .pin .ik.szin,.mk.sel .pin .ik.szin,.mk.eredeti .pin .ik.szin{display:block}
  .mk.focus .pin .ik.sem,.mk.sel .pin .ik.sem,.mk.eredeti .pin .ik.sem{display:none}
  .mk:not(.szektor):not(.focus):not(.sel):not(.eredeti) .pin{box-shadow:0 0 0 2px rgba(16,24,40,.7),0 4px 12px rgba(0,0,0,.45)}
  .mk.hidden{opacity:0;pointer-events:none}
  /* összevont pin (több azonos típus egy helyen): darabszám-jelvény; a beolvadt tagok rejtve */
  .mk.osszevont{opacity:0;pointer-events:none}
  /* a modell mögé került buborék (mélységpróba) */
  .mk.takart{opacity:0;pointer-events:none}
  .mk .pin{position:relative}
  .mk .db{display:none;position:absolute;right:-7px;top:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--text);color:var(--navy);font:800 12px/19px Nunito,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .mk.csoport .db{display:block}
  /* szűréskor: a többi halvány, a kijelölt típus kiemelkedik (V2) */
  .mk.dim{opacity:.32;filter:saturate(.35)}
  .mk.dim .pin{box-shadow:0 0 0 2px rgba(16,24,40,.6)}
  .mk.focus{}
  .mk.focus:not(.szektor) .pin{box-shadow:0 0 0 3px rgba(252,252,253,.85),0 6px 18px rgba(0,0,0,.45),0 0 30px 6px var(--pin)}
  .mk.sel{z-index:5000!important}
  .mk.szektor .pin{width:auto;height:22px;border-radius:6px;padding:0 7px;font-size:11px;font-weight:800;color:var(--yellow);background:var(--navy);border:1px solid rgba(252,191,32,.5);box-shadow:0 2px 8px rgba(0,0,0,.4);animation:none}
  .mk.szektor.sel .pin{background:var(--yellow);color:var(--navy)}
  .mk.szektor .stem{display:none}
  /* közös mosdó-pin: a szár helyett elágazó vonal (svg) vezet az ajtókhoz */
  .mk.agas .stem{display:none}
  .agak{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .agak path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}

  /* --- jobb oldali infópanel (Ziggo-stílus) --- */
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:12;background:var(--navy);border-left:1px solid var(--panel-border);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
  .panel.show{transform:translateX(0)}
  .panel .photo{aspect-ratio:16/10;background:#1D2939 center/cover no-repeat;flex:none;position:relative}
  .panel .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,24,40,0) 55%,var(--navy) 100%)}
  .panel .x{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(16,24,40,.75);color:var(--text);font-size:20px;cursor:pointer;line-height:1;backdrop-filter:blur(8px)}
  .panel .photo{transition:background-image .25s}
  .panel .photo .cap{position:absolute;left:12px;top:14px;z-index:2;max-width:70%;padding:4px 9px;border-radius:7px;background:rgba(16,24,40,.7);color:var(--text);font-size:11px;font-weight:600;backdrop-filter:blur(8px)}
  .panel .photo .cap:empty{display:none}
  .panel .body{padding:22px 26px 26px;overflow:auto}
  .panel .cat{font-size:13px;font-weight:800;color:var(--yellow);letter-spacing:.02em}
  .panel h2{margin:6px 0 12px;font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
  .panel p{margin:0 0 8px;color:#D0D5DD;font-size:15px;line-height:1.55}
  .panel .photo2{aspect-ratio:16/10;border-radius:12px;background:#1D2939 center/cover no-repeat;margin:14px 0 4px}
  .panel .near{margin:14px 0 0;font-size:13px;color:var(--muted)}
  .panel .near b{color:var(--text);font-weight:700}
  .panel .more{display:inline-flex;align-items:center;gap:10px;margin-top:22px;height:44px;padding:0 24px;border-radius:8px;border:0;color:var(--navy);font:400 16px Nunito,sans-serif;background:var(--yellow);cursor:pointer;text-decoration:none}
  .panel .more:hover{filter:brightness(1.08)}
  .panel .back{margin-top:12px;display:block;background:transparent;border:0;color:var(--muted);font:600 13px Nunito,sans-serif;cursor:pointer;padding:0}
  .panel .back:hover{color:var(--text)}
  .panel .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
  .panel .facts:empty{display:none}
  .panel .fact{background:rgba(252,252,253,.05);border-radius:12px;padding:9px 12px}
  .panel .fact small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
  .panel .fact b{font-size:14.5px;font-weight:800}
  .panel .plist{display:flex;flex-direction:column;gap:2px;margin:12px -8px 0}
  .panel .plist:empty{display:none}
  .panel .plist .cim{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:6px 8px 4px}

  /* --- vissza az áttekintéshez (részletnézetben) --- */
  .overview{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:10;display:none;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--panel-border);color:var(--text);font:700 13px Nunito,sans-serif;cursor:pointer;backdrop-filter:blur(14px)}
  .overview.show{display:inline-flex}
  body.panel-open .overview{display:none}
  .overview:hover{border-color:var(--yellow)}

  /* --- loader --- */
  .loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
  .loader.hide{opacity:0;pointer-events:none}
  .loader .pct{font-size:56px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .loader .lvl{color:var(--muted);font-size:14px;font-weight:500}
  .loader .bar{width:220px;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
  .loader .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .loader .logo{width:min(220px,60vw);height:auto;display:block;margin-bottom:10px;animation:breathe 2.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

  .forras{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:8;font-size:10.5px;color:var(--muted);opacity:.8;white-space:nowrap}
  .forras a{color:inherit}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:60;background:var(--navy);border:1px solid var(--panel-border);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .hint{position:fixed;left:50%;top:72px;transform:translateX(-50%);color:var(--muted);font-size:12px;z-index:9;pointer-events:none;transition:.4s}
  .hint.hide{opacity:0}

  @media (max-width:640px){
    /* telefon: szintváltó a logó alatt (vízszintesen görgethető), a lista és a szolgáltatások alulról felhúzható lapon */
    .levels{position:fixed;top:58px;left:12px;right:12px;margin:0;overflow-x:auto;scrollbar-width:none}
    .levels::-webkit-scrollbar{display:none}
    .levels button{height:34px;padding:0 13px;font-size:13px;flex:none}
    .side{left:0;right:0;top:auto;bottom:0;width:100%;height:62vh;border-radius:18px 18px 0 0;border-bottom:0;z-index:13}
    body.side-closed .side{transform:translateY(100%)}
    .sideOpen{top:auto;bottom:16px;left:12px;height:44px}
    .panel{top:auto;left:0;right:0;width:100%;height:62vh;border-left:0;border-top:1px solid var(--panel-border);border-radius:18px 18px 0 0;transform:translateY(100%)}
    .panel.show{transform:translateY(0)}
    .panel .photo{aspect-ratio:16/7}
    .panel h2{font-size:22px}
    body.panel-open .sideOpen{display:none}
    .overview{top:auto;bottom:140px}
    .brand{height:56px;padding:0 12px;gap:10px}.brand img{height:22px}.brand h1{font-size:13.5px}.brand small{font-size:11.5px}.brand .sep{height:22px}
    .hint{display:none}
    .hovtip{display:none}
    .tools{right:12px;bottom:16px}
    .tools button{width:42px;height:42px}
    .tools button .t{display:none}
    .tools button.negyzet,.tools .gap{display:none}   /* telefonon két ujjas csípés nagyít */
    body.panel-open .tools{transform:none;opacity:0;pointer-events:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="markers"></div>

<div class="brand">
  <img src="/projekt/mvm-dome-teszt/logo.svg" alt="MVM Dome">
  <div class="sep"></div>
  <div><h1>Interaktív térkép</h1><small id="lvlSub">Lobby – Bejárati szint</small></div>
  <nav class="levels" id="levels" aria-label="Szint">
    <button data-level="epulet" title="A teljes épület kívülről">Épület</button>
    <button data-level="lobby" class="active" title="Lobby – Bejárati szint">Lobby</button>
    <button data-level="also" title="Alsó körüljáró szint">Alsó körüljáró</button>
    <button data-level="paholy" title="Páholy szint (VIP)">Páholy (VIP)</button>
    <button data-level="felso" title="Felső körüljáró szint">Felső körüljáró</button>
  </nav>
</div>

<div class="hint" id="hint" hidden></div>

<aside class="side" id="side">
  <div class="sideHead">
    <label class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="kereso" type="search" placeholder="Keresés: 206, mosdó, büfé…" autocomplete="off"></label>
    <button class="sideX" id="sideX" title="Panel elrejtése" aria-label="Panel elrejtése">‹</button>
  </div>
  <div class="tabs" id="tabs"><button data-tab="szektor" class="on">Szektorok</button><button data-tab="szolg">Szolgáltatások</button></div>
  <div class="pane" id="paneSzektor"></div>
  <div class="pane" id="paneSzolg" hidden><div class="filters" id="filters"><div class="title">Mutasd csak</div></div></div>
  <div class="pane" id="paneTalalat" hidden></div>
</aside>
<button class="sideOpen" id="sideOpen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Szektorok és szolgáltatások</button>
<div class="hovtip" id="hovtip"></div>

<aside class="panel" id="panel">
  <div class="photo" id="panelPhoto"><button class="x" id="panelX" aria-label="Bezárás">×</button>
    <div class="cap" id="photoCap"></div></div>
  <div class="body">
    <div class="cat" id="panelCat"></div>
    <h2 id="panelTitle"></h2>
    <p id="panelText"></p>
    <div class="facts" id="panelFacts"></div>
    <div class="plist" id="panelList"></div>
    <div class="photo2" id="panelPhoto2" style="display:none"></div>
    <div class="near" id="panelNear"></div>
    <a class="more" id="panelMore" href="https://mvm-dome.hu/hu/szolgaltatasok" target="_blank" rel="noopener">Bővebben <span>›</span></a>
  </div>
</aside>
<div class="tools" id="tools">
  <button id="tPlusz" class="negyzet" aria-label="Nagyítás"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="t">Nagyítás</span></button>
  <button id="tMinusz" class="negyzet" aria-label="Távolítás"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg><span class="t">Távolítás</span></button>
  <div class="gap"></div>
  <button id="tAlap" aria-label="Alapnézet"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span class="t">Alapnézet</span></button>
  <button id="tFelul" aria-label="Felülnézet"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg><span class="t">Felülnézet</span></button>
  <button id="tForgas" class="kapcs on" aria-label="Forgás ki / be"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg><span class="t">Forgás ki / be</span></button>
  <button id="tSzektor" class="kapcs on" aria-label="Szektorszámok ki / be"><svg viewBox="0 0 24 24"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3 15h16"/></svg><span class="t">Szektorszámok ki / be</span></button>
</div>
<button class="overview" id="overviewBtn">‹ Vissza az áttekintéshez</button>

<div class="loader" id="loader">
  <img class="logo" src="/projekt/mvm-dome-teszt/loader-logo.png" alt="MVM Dome">
  <div class="pct" id="pct">0%</div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="lvl" id="lvlName">Térkép betöltése</div>
</div>
<div class="toast" id="toast"></div>
<div class="forras" id="forras" style="display:none">Környékrajz: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> közreműködők</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="/projekt/mvm-dome-teszt/app.js"></script>
</body>
</html>
